<div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-4 bg-white">
  <div class="card-body p-4 d-flex flex-column justify-content-center">
    <!-- HEADER: Ciudad y Hora -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h6 class="fw-bold mb-0 text-uppercase text-muted"
          style="letter-spacing: 1px;
                 font-size: 0.8rem">
        <i class="bi bi-geo-alt-fill text-danger me-1"></i> Los Ángeles
      </h6>
      <span class="badge bg-light text-dark border shadow-none" id="weather-time">--:--</span>
    </div>

    <!-- BODY: Temp y Estado -->
    <div class="py-2 text-center">
      <h2 id="weather-temp" class="display-5 fw-bold mb-1 text-dark">
--&deg;C
      </h2>
      <p id="weather-state"
         class="fs-5 mb-0 fw-medium text-primary text-capitalize">
Cargando clima...
      </p>
    </div>

    <!-- FOOTER: Humedad -->
    <div class="mt-4 border-top border-light pt-3">
      <div class="d-flex align-items-center text-muted small fw-bold">
        <i class="bi bi-droplet-fill text-info me-2"></i> Humedad: <span id="weather-humidity" class="ms-1 text-dark">-- %</span>
      </div>
    </div>
  </div>
</div>
