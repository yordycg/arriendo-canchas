<div class="card shadow-sm border-0 rounded-4 h-100 bg-white">
    <div class="card-body p-4 d-flex flex-column justify-content-center">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="fw-bold mb-0 text-uppercase text-muted" style="letter-spacing: 1px; font-size: 0.8rem;">
                <i class="bi bi-geo-alt-fill text-danger me-1"></i> Los Ángeles
            </h6>
            <span class="badge bg-light text-dark border shadow-none" id="weather-time">--:--</span>
        </div>
        
        <div class="d-flex align-items-center mb-3">
            <div class="me-4 text-center" style="width: 60px;">
                <i id="weather-icon" class="bi bi-cloud-sun display-4 text-primary"></i>
            </div>
            <div>
                <h2 id="weather-temp" class="display-5 fw-bold mb-0 text-dark">--&deg;C</h2>
                <p id="weather-state" class="fs-6 mb-0 fw-medium text-secondary">Cargando clima...</p>
            </div>
        </div>

        <div class="mt-auto border-top border-light pt-3">
            <div class="d-flex align-items-center text-muted small fw-bold">
                <i class="bi bi-wind text-info me-2"></i> Viento: <span id="weather-humidity" class="ms-1 text-dark">-- km/h</span>
            </div>
        </div>
    </div>
</div>
