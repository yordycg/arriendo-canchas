<!DOCTYPE html>
<html lang="es">
  <head>
{% load static %}

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}
Mi App
      {% endblock title %}
    </title>
    <link rel="stylesheet"
          href="{% static 'authentication/css/bootstrap.min.css' %}" />
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    {% block extra_css %}
    {% endblock extra_css %}
  </head>
  <body class="bg-light d-flex flex-column min-vh-100">
    <main class="flex-grow-1 d-flex flex-column">
      {% block content %}
      {% endblock content %}
    </main>

    <footer class="py-3 mt-auto bg-white border-top">
      <div class="text-center text-muted">
        <p class="mb-0">
          <small>© 2026 Arriendo Canchas - IPVG</small>
        </p>
      </div>
    </footer>

    <script src="{% static 'authentication/js/jquery-4.0.0.min.js' %}"></script>
    <script src="{% static 'authentication/js/bootstrap.min.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    {% if sw_alert %}
      <script id="sw-data" type="application/json">
          {
              "type": "{{ sw_alert.type }}",
              "title": "{{ sw_alert.title }}",
              "message": "{{ sw_alert.message }}"
          }
      </script>
    {% endif %}
    <script src="{% static 'authentication/js/alert.js' %}"></script>
  </body>
</html>
