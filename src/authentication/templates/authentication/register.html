{% extends "authentication/base.html" %}

{% block title %}
    Registro - Canchas
{% endblock title %}
{% block extra_css %}
  <style>
      .register__container {
          background: linear-gradient(135deg, #0d6efd 0%, #0a57ca 100%);
      }
  </style>
{% endblock extra_css %}
{% block content %}
  <section class="register__container flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

          <div class="text-center mb-4 text-white">
            <h2 class="fw-bold">
              Arriendo Canchas
            </h2>
            <p class="opacity-75">
Crea tu cuenta para empezar a jugar
            </p>
          </div>

          <div class="card border-0 shadow-lg rounded-4 p-4">
            <form method="POST">
{% csrf_token %}
              <div class="mb-3">
                <label for="rut" class="form-label fw-bold">
RUT
                </label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-card-text"></i></span>
                  <input type="text"
                         name="rut"
                         id="rut"
                         class="form-control border-start-0"
                         placeholder="12.345.678-9"
                         required>
                </div>
              </div>

              <div class="mb-3">
                <label for="nombres" class="form-label fw-bold">
Nombres
                </label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
                  <input type="text"
                         name="nombres"
                         id="nombres"
                         class="form-control border-start-0"
                         placeholder="Juan Pedro"
                         required>
                </div>
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="apellido_p" class="form-label fw-bold">
Apellido Paterno
                  </label>
                  <input type="text"
                         name="apellido_p"
                         id="apellido_p"
                         class="form-control"
                         placeholder="Perez"
                         required>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="apellido_m" class="form-label fw-bold">
Apellido Materno
                  </label>
                  <input type="text"
                         name="apellido_m"
                         id="apellido_m"
                         class="form-control"
                         placeholder="Soto">
                </div>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label fw-bold">
Email
                </label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope"></i></span>
                  <input type="email"
                         name="email"
                         id="email"
                         class="form-control border-start-0"
                         placeholder="juan@correo.com"
                         required>
                </div>
              </div>

              <div class="mb-4">
                <label for="password" class="form-label fw-bold">
Contraseña
                </label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
                  <input type="password"
                         name="password"
                         id="password"
                         class="form-control border-start-0"
                         placeholder="********"
                         required>
                </div>
              </div>

              <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary btn-lg fw-bold shadow-sm">
                  Registrarme
                  <i class="bi bi-arrow-right-circle ms-2"></i>
                </button>
              </div>

              <div class="text-center mt-3">
                <span class="text-muted small">¿Ya tienes cuenta?</span>
                <a href="{% url 'authentication:login' %}"
                   class="text-primary small fw-bold text-decoration-none">Inicia Sesión</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>
{% endblock content %}
