<!DOCTYPE html>
<html lang="es">
  <head>
{% load static %}

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión - Arriendo Canchas</title>
    <link rel="stylesheet"
          href="{% static 'authentication/css/bootstrap.min.css' %}" />
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  </head>
  <body class="bg-light">
    <!-- Navbar simple para Login -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5 shadow">
      <div class="container">
        <a class="navbar-brand" href="#">
          <i class="bi bi-trophy-fill me-2"></i>Arriendo Canchas
        </a>
      </div>
    </nav>

    <section class="container">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="card shadow border-0">
            <div class="card-header bg-primary text-white py-3 text-center">
              <h4 class="mb-0 fw-bold">
Acceso al Sistema
              </h4>
            </div>
            <div class="card-body p-4">
              <form method="POST" action="{% url 'authentication:login' %}">
{% csrf_token %}
                <div class="mb-4">
                  <label for="email" class="form-label fw-bold">
Correo Electrónico
                  </label>
                  <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                    <input type="text"
                           name="username"
                           id="username"
                           class="form-control"
                           placeholder="Emailejemplo@correo.cl / Rut: 188550851"
                           required />
                  </div>
                </div>

                <div class="mb-4">
                  <label for="password" class="form-label fw-bold">
Contraseña
                  </label>
                  <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                    <input type="password"
                           name="password"
                           id="password"
                           class="form-control"
                           placeholder="********"
                           required />
                  </div>
                </div>

                <div class="d-grid gap-2">
                  <button type="submit" class="btn btn-primary btn-lg fw-bold">
                    Ingresar
                    <i class="bi bi-arrow-right-short ms-1"></i>
                  </button>
                </div>
              </form>
            </div>
            <div class="card-footer bg-white py-3 text-center">
              <small class="text-muted">¿No tienes cuenta?</small>
              <a href="{% url 'authentication:register' %}"
                 class="text-primary fw-bold text-decoration-none small">Regístrate aquí</a>
            </div>
          </div>

          <div class="text-center mt-4 text-muted">
            <p>
              <small>&copy; 2026 Arriendo Canchas - IPVG</small>
            </p>
          </div>
        </div>
      </div>
    </section>

    <script src="{% static 'authentication/js/jquery-4.0.0.min.js' %}"></script>
    <script src="{% static 'authentication/js/bootstrap.min.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    {% if sw_alert %}
      <script id="sw-data" type="application/json">
          {
              "type": "{{ sw_alert.type }}",
              "title": "{{ sw_alert.title }}",
              "message": "{{ sw_alert.message }}"
          }
      </script>
    {% endif %}
    <script src="{% static 'authentication/js/alert.js' %}"></script>
  </body>
</html>
