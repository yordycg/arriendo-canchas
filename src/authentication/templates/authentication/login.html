{% extends "core/auth_base.html" %}

{% block title %}
Login - Canchas
{% endblock title %}

{% block content %}
  <section class="container d-flex flex-grow-1 align-items-center justify-content-center">
    <div class="row w-100 justify-content-center">
      <div class="col-md-5">
        <div class="card shadow border-0">

          <div class="card-header bg-primary text-white py-3 text-center">
            <h4 class="mb-0 fw-bold">
Inicio Sesión
            </h4>
          </div>
          <div class="card-body p-4">
            <form method="POST" action="{% url 'authentication:login' %}">
{% csrf_token %}
              <div class="mb-4">
                <label for="usuario" class="form-label fw-bold">
RUT / Email
                </label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-person-badge"></i></span>
                  <input type="text"
                         name="usuario"
                         id="usuario"
                         class="form-control"
                         placeholder="188550851 / ejemplo@correo.cl"
                         required />
                </div>
              </div>

              <div class="mb-4">
                <label for="password" class="form-label fw-bold">
Contraseña
                </label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                  <input type="password"
                         name="password"
                         id="password"
                         class="form-control"
                         placeholder="********"
                         required />
                </div>
              </div>

              <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg fw-bold">
                  <i class="bi bi-check2-circle me-2"></i>Ingresar
                </button>
              </div>
            </form>
          </div>
          <div class="card-footer bg-white py-3 text-center">
            <small class="text-muted">¿No tienes cuenta?</small>
            <a href="{% url 'authentication:register' %}"
               class="text-primary fw-bold text-decoration-none small">Regístrate aquí</a>
          </div>
        </div>
      </div>
    </div>
  </section>
{% endblock content %}
