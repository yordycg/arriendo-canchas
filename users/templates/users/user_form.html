<!doctype html>
<html lang="es">
  <head>
    {% load static %}
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrar Usuario - Arriendo Canchas</title>
    <link rel="stylesheet" href="{% static 'users/css/bootstrap.min.css' %}" />
  </head>
  <body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow">
      <div class="container">
        <a class="navbar-brand" href="/users/">Arriendo Canchas</a>
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="/users/">Inicio</a>
          <a class="nav-link active" href="/users/form/">Agregar Usuario</a>
        </div>
      </div>
    </nav>

    <section class="container">
      <div class="row justify-content-center">
        <div class="col-md-8">
          {% if error %}
          <div
            class="alert alert-danger alert-dismissible fade show"
            role="alert"
          >
            <strong>Error!</strong> {{ error }}
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="alert"
              aria-label="Close"
            ></button>
          </div>
          {% endif %}

          <div class="card shadow border-0">
            <div class="card-header bg-primary text-white py-3">
              <h4 class="mb-0">Registrar Nuevo Usuario</h4>
            </div>
            <div class="card-body p-4">
              <form method="GET" action="/users/add/">
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="rut" class="form-label fw-bold">RUT</label>
                    <input
                      type="text"
                      name="rut"
                      id="rut"
                      class="form-control"
                      placeholder="12.345.678-9"
                      required
                    />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label for="nombres" class="form-label fw-bold"
                      >Nombres</label
                    >
                    <input
                      type="text"
                      name="nombres"
                      id="nombre"
                      class="form-control"
                      placeholder="Ej: Juan Andres"
                      required
                    />
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="apellido_p" class="form-label fw-bold"
                      >Apellido Paterno</label
                    >
                    <input
                      type="text"
                      name="apellido_p"
                      id="apellido_p"
                      class="form-control"
                      placeholder="Perez"
                    />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label for="apellido_m" class="form-label fw-bold"
                      >Apellido Materno</label
                    >
                    <input
                      type="text"
                      name="apellido_m"
                      id="apellido_m"
                      class="form-control"
                      placeholder="Gonzalez"
                    />
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="email" class="form-label fw-bold">Email</label>
                    <input
                      type="email"
                      name="email"
                      id="email"
                      class="form-control"
                      placeholder="ejemplo@email.cl"
                    />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label for="password" class="form-label fw-bold"
                      >Contraseña</label
                    >
                    <input
                      type="password"
                      name="password"
                      id="password"
                      class="form-control"
                      placeholder="********"
                    />
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label d-block fw-bold">Sexo</label>
                    <div class="form-check form-check-inline mt-2">
                      <input
                        class="form-check-input"
                        type="radio"
                        name="sexo"
                        id="sexoM"
                        value="M"
                        checked
                      />
                      <label class="form-check-label" for="sexoM"
                        >Masculino</label
                      >
                    </div>
                    <div class="form-check form-check-inline">
                      <input
                        class="form-check-input"
                        type="radio"
                        name="sexo"
                        id="sexoF"
                        value="F"
                      />
                      <label class="form-check-label" for="sexoF"
                        >Femenino</label
                      >
                    </div>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label for="telefono" class="form-label fw-bold"
                      >Teléfono</label
                    >
                    <input
                      type="tel"
                      name="telefono"
                      id="telefono"
                      class="form-control"
                      placeholder="+569 1234 5678"
                    />
                  </div>
                </div>

                <hr class="my-4" />

                <div class="row">
                  <div class="col-md-4 mb-3">
                    <label for="estado_usuario_id" class="form-label fw-bold"
                      >Estado</label
                    >
                    <select
                      name="estado_usuario_id"
                      id="estado_usuario_id"
                      class="form-select"
                      required
                    >
                      <option value="" selected disabled>Seleccione...</option>
                      {% for estado in estados %}
                      <option value="{{ estado.estado_usuario_id }}">
                        {{ estado.nombre }}
                      </option>
                      {% endfor %}
                    </select>
                  </div>
                  <div class="col-md-4 mb-3">
                    <label for="rol_id" class="form-label fw-bold">Rol</label>
                    <select
                      name="rol_id"
                      id="rol_id"
                      class="form-select"
                      required
                    >
                      <option value="" selected disabled>Seleccione...</option>
                      {% for rol in roles %}
                      <option value="{{ rol.rol_id }}">{{ rol.nombre }}</option>
                      {% endfor %}
                    </select>
                  </div>
                  <div class="col-md-4 mb-3">
                    <label for="membresia_id" class="form-label fw-bold"
                      >Membresía</label
                    >
                    <select
                      name="membresia_id"
                      id="membresia_id"
                      class="form-select"
                      required
                    >
                      <option value="" selected disabled>Seleccione...</option>
                      {% for membresia in membresias %}
                      <option value="{{ membresia.membresia_id }}">
                        {{ membresia.nombre }}
                      </option>
                      {% endfor %}
                    </select>
                  </div>
                </div>

                <div class="d-grid gap-2 mt-4">
                  <button type="submit" class="btn btn-success btn-lg">
                    <i class="bi bi-check-circle-fill me-2"></i>Guardar Usuario
                  </button>
                  <a href="/users/" class="btn btn-outline-secondary"
                    >Cancelar</a
                  >
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="{% static 'users/js/jquery-4.0.0.min.js' %}"></script>
    <script src="{% static 'users/js/bootstrap.min.js' %}"></script>
  </body>
</html>
